<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظّم المستندات</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14231d;--mut:#5d6f67;--bd:#d9e3de;--pr:#0f6b4f;--gold:#c9a23a;--side:#0b3d2e;--danger:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1714;--card:#17241f;--tx:#eef5f1;--mut:#9fb3aa;--bd:#2a3d35}}
:root[data-theme=dark]{--bg:#0e1714;--card:#17241f;--tx:#eef5f1;--mut:#9fb3aa;--bd:#2a3d35}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--side);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px}
header h1{font-size:18px;margin:0;flex:1}
.ib{background:none;border:0;color:inherit;cursor:pointer;padding:6px;border-radius:8px;display:inline-flex;align-items:center}
.ib:hover{background:rgba(127,127,127,.2)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#side{position:fixed;top:0;bottom:0;right:0;width:270px;max-width:82%;background:var(--side);color:#fff;z-index:20;transform:translateX(100%);transition:.25s;overflow-y:auto;padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px))}
#side.open{transform:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none}#ov.open{display:block}
#side .top{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 12px;font-weight:700}
#side a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:12px;border-radius:10px;margin:2px 0;cursor:pointer;font-size:16px}
#side a.act{background:var(--gold);color:#1a1a1a;font-weight:700}
#side a:hover:not(.act){background:rgba(255,255,255,.12)}
main{padding:14px;max-width:900px;margin:auto;padding-bottom:80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{text-align:center;cursor:pointer}.stat b{display:block;font-size:26px;color:var(--pr)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--danger)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
.row{display:flex;align-items:center;gap:10px}.row .info{flex:1;min-width:0}
.row .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut)}
.acts{display:flex;gap:2px;flex-wrap:wrap}.acts .ib{color:var(--pr);border:1px solid var(--bd)}.acts .ib.d{color:var(--danger)}.acts .ib.on{color:var(--gold)}.acts .ib.wa{color:#25D366}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--bd);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--pr);flex:none}.thumb img{width:100%;height:100%;object-fit:cover}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.ok{color:#1b8a4b}.warn{color:#b9770e}.bad{color:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
.modal img{max-width:100%;border-radius:10px}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:40;display:none}
h2{margin:6px 0 12px;font-size:20px}.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px}
</style>
</head>
<body>
<header>
<button class="ib" onclick="menu(1)" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
<h1 id="ttl">منظّم المستندات</h1>
<button class="ib" onclick="appShare()" aria-label="مشاركة التطبيق عبر واتساب" style="color:#25D366"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-5A9 9 0 1 1 8 19.4zM9 9c0 4 3 6 6 6l1-2-2-1-1 1c-1-.4-2-1.4-2.4-2.4l1-1-1-2z"/></svg></button>
<button class="ib" onclick="theme()" aria-label="الوضع"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>
<div id="ov" onclick="menu(0)"></div>
<nav id="side"></nav>
<main id="main"></main>
<footer>تطوير: عدنان صبياني</footer>
<div id="toast"></div>
<input type="file" id="fi" hidden multiple accept="image/*,application/pdf,.doc,.docx">
<input type="file" id="fc" hidden accept="image/*" capture="environment">
<script>
const I={home:'<path d="M3 11l9-8 9 8v10H3z"/>',files:'<path d="M3 6h7l2 2h9v12H3z"/>',renew:'<path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>',fav:'<path d="M12 3l2.8 6 6.2.7-4.6 4.3 1.3 6.3-5.7-3.2-5.7 3.2 1.3-6.3L3 9.7 9.2 9z"/>',quick:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',log:'<path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/>',share:'<path d="M4 12v8h16v-8M12 3v13M7 8l5-5 5 5"/>',store:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>',status:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',dev:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',plus:'<path d="M12 5v14M5 12h14"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="4"/>',scan:'<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',wa:'<path d="M3 21l1.6-5A9 9 0 1 1 8 19.4zM9 9c0 4 3 6 6 6l1-2-2-1-1 1c-1-.4-2-1.4-2.4-2.4l1-1-1-2z"/>',back:'<path d="M9 6l6 6-6 6"/>',x:'<path d="M5 5l14 14M19 5L5 19"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>',doc:'<path d="M6 3h9l4 4v14H6zM14 3v5h5"/>',move:'<path d="M3 12h15M13 6l6 6-6 6M3 5v14"/>'};
const ic=(n)=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const PAGES=[['home','الرئيسية','home'],['files','الملفات والمجلدات','files'],['renew','التجديدات','renew'],['fav','المفضلة','fav'],['quick','الوصول السريع','quick'],['trash','سلة المحذوفات','trash'],['log','سجل النشاط','log'],['shares','المشاركات','share'],['storage','التخزين والنسخ الاحتياطي','store'],['status','حالة التطبيق','status'],['settings','الإعدادات','set'],['dev','المطور','dev']];
let S={items:[],log:[],shares:[],email:'',theme:''},page='home',cwd=null,q='';
try{S=Object.assign(S,JSON.parse(localStorage.getItem('docorg')||'{}'))}catch(e){}
let saveOK=true;
let db=null,EST={u:0,q:0};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('docorg',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function full(){saveOK=false;toast('المساحة ممتلئة، لم يتم الحفظ')}
function save(){if(!db){try{localStorage.setItem('docorg',JSON.stringify(S));saveOK=true}catch(e){full()}return}
try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(S,'S');t.oncomplete=()=>{saveOK=true};t.onerror=t.onabort=full}catch(e){full()}}
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2200)}
function addLog(t,n){S.log.unshift({id:uid(),act:t,name:n,at:new Date().toISOString()})}
function menu(o){$('#side').classList.toggle('open',!!o);$('#ov').classList.toggle('open',!!o)}
function theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=S.theme=cur==='dark'?'light':'dark';save()}
if(S.theme)document.documentElement.dataset.theme=S.theme;
function go(p){page=p;q='';if(p!=='files')cwd=cwd;menu(0);render();scrollTo(0,0)}
function nav(){$('#side').innerHTML=`<div class="top"><span>القائمة</span><button class="ib" onclick="menu(0)" aria-label="إغلاق">${ic('x')}</button></div>`+PAGES.map(p=>`<a class="${p[0]===page?'act':''}" onclick="go('${p[0]}')">${ic(p[2])}${p[1]}</a>`).join('')}
const live=()=>S.items.filter(i=>!i.trash);
function days(d){return d?Math.ceil((new Date(d)-new Date(new Date().toDateString()))/864e5):null}
function rstat(i){const n=days(i.exp);if(n===null)return'';return n<0?`<span class="bad">منتهي منذ ${-n} يوم</span>`:n<=30?`<span class="warn">ينتهي بعد ${n} يوم</span>`:`<span class="ok">ساري (${n} يوم)</span>`}
function thumb(i){return `<div class="thumb">${i.folder?ic('files'):i.data&&i.mime.startsWith('image')?`<img src="${i.data}" alt="">`:ic('doc')}</div>`}
function acts(i,trash){if(trash)return `<div class="acts"><button class="ib" title="استرجاع" onclick="restore('${i.id}')">${ic('undo')}</button><button class="ib d" title="حذف نهائي" onclick="purge('${i.id}')">${ic('del')}</button></div>`;
return `<div class="acts"><button class="ib" title="معاينة" onclick="preview('${i.id}')">${ic('eye')}</button><button class="ib" title="تعديل" onclick="editItem('${i.id}')">${ic('edit')}</button><button class="ib" title="نقل إلى مجلد" onclick="moveItem('${i.id}')">${ic('move')}</button><button class="ib ${i.fav?'on':''}" title="مفضلة" onclick="tog('${i.id}','fav')">${ic('fav')}</button><button class="ib ${i.quick?'on':''}" title="وصول سريع" onclick="tog('${i.id}','quick')">${ic('quick')}</button><button class="ib wa" title="مشاركة واتساب" onclick="shareItem('${i.id}')">${ic('wa')}</button><button class="ib d" title="حذف" onclick="del('${i.id}')">${ic('del')}</button></div>`}
function list(arr,trash){if(!arr.length)return'<div class="card" style="text-align:center;color:var(--mut)">لا توجد عناصر</div>';
return arr.map(i=>`<div class="card"><div class="row" ${i.folder&&!trash?`onclick="openF('${i.id}')" style="cursor:pointer"`:''}>${thumb(i)}<div class="info"><b>${esc(i.name)}</b><small>${esc(i.tag||'')} ${i.exp?'· '+rstat(i):''}</small></div></div><div style="margin-top:8px">${acts(i,trash)}</div></div>`).join('')}
function tog(id,k){const i=S.items.find(x=>x.id===id);i[k]=!i[k];addLog((i[k]?'إضافة إلى ':'إزالة من ')+(k==='fav'?'المفضلة':'الوصول السريع'),i.name);save();render()}
function del(id){const i=S.items.find(x=>x.id===id);if(!confirm('نقل «'+i.name+'» إلى سلة المحذوفات؟'))return;i.trash=1;addLog('حذف',i.name);save();render()}
function restore(id){const i=S.items.find(x=>x.id===id);i.trash=0;addLog('استرجاع',i.name);save();render()}
function purge(id){const i=S.items.find(x=>x.id===id);if(!confirm('حذف نهائي؟ لا يمكن التراجع.'))return;S.items=S.items.filter(x=>x.id!==id);addLog('حذف نهائي',i.name);save();render()}
function modal(h){const m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target===m)m.remove()};m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m);return m}
const close=()=>document.querySelectorAll('.modal').forEach(m=>m.remove());
function preview(id){const i=S.items.find(x=>x.id===id);let b=i.folder?`<p>مجلد يحتوي ${S.items.filter(x=>x.parent===i.id&&!x.trash).length} عنصر</p>`:i.data&&i.mime.startsWith('image')?`<img src="${i.data}">`:i.data&&i.mime==='application/pdf'?`<iframe src="${i.data}" style="width:100%;height:55vh;border:0"></iframe>`:'<p>لا توجد معاينة لهذا النوع</p>';
modal(`<h2>${esc(i.name)}</h2>${b}<p><small>الوسم: ${esc(i.tag||'-')}<br>الانتهاء: ${i.exp||'-'} ${rstat(i)}<br>ملاحظات: ${esc(i.note||'-')}</small></p><button class="btn alt" onclick="close()">إغلاق</button>`)}
function editItem(id){const i=S.items.find(x=>x.id===id);const m=modal(`<h2>تعديل</h2><label>الاسم</label><input id="e1" value="${esc(i.name)}"><label>الوسم</label><input id="e2" value="${esc(i.tag||'')}">${i.folder?'':`<label>تاريخ الانتهاء / التجديد</label><input id="e3" type="date" value="${i.exp||''}">`}<label>ملاحظات</label><textarea id="e4" rows="2">${esc(i.note||'')}</textarea><div class="row"><button class="btn" id="sv">حفظ</button><button class="btn alt" onclick="close()">إلغاء</button></div>`);
m.querySelector('#sv').onclick=()=>{i.name=m.querySelector('#e1').value.trim()||i.name;i.tag=m.querySelector('#e2').value.trim();if(m.querySelector('#e3'))i.exp=m.querySelector('#e3').value;i.note=m.querySelector('#e4').value;addLog('تعديل',i.name);save();m.remove();render()}}
function shareItem(id){const i=S.items.find(x=>x.id===id);const pv=i.data&&i.mime.startsWith('image')?`<img src="${i.data}">`:`<div class="thumb" style="width:80px;height:80px">${ic('doc')}</div>`;
const m=modal(`<h2>معاينة المشاركة</h2>${pv}<p><b>${esc(i.name)}</b></p><label>رقم واتساب (اختياري، مع رمز الدولة)</label><input id="wn" inputmode="tel" placeholder="9665xxxxxxxx"><label>الرسالة</label><textarea id="wm" rows="2">مستند: ${esc(i.name)}</textarea><div class="row"><button class="btn" id="go">${ic('wa')} إرسال</button><button class="btn alt" onclick="close()">إلغاء</button></div><small>يفتح واتساب بالرسالة، ثم أرفق الملف من المعرض أو حمّله من الزر أدناه.</small><br><button class="btn alt" id="dl">تنزيل الملف للإرفاق</button>`);
m.querySelector('#dl').onclick=()=>{if(!i.data)return toast('لا يوجد ملف');const a=document.createElement('a');a.href=i.data;a.download=i.name;a.click()};
m.querySelector('#go').onclick=async()=>{const n=m.querySelector('#wn').value.replace(/\D/g,''),t=m.querySelector('#wm').value;
try{if(i.data&&navigator.canShare){const b=await (await fetch(i.data)).blob(),f=new File([b],i.name,{type:i.mime});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:t});rec();return}}}catch(e){}
window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank');rec();
function rec(){S.shares.unshift({id:uid(),item:i.id,name:i.name,to:n,at:new Date().toISOString()});addLog('مشاركة واتساب',i.name);save();m.remove();render()}}}
function appShare(){window.open('https://wa.me/?text='+encodeURIComponent('منظّم المستندات: '+location.href),'_blank')}
function chooseFolder(def,title,cb,ex){const fs=S.items.filter(i=>i.folder&&!i.trash);
const rows=(p,d)=>fs.filter(f=>(f.parent||null)===p&&f.id!==ex).map(f=>`<label class="card row" style="margin:4px 0;padding-right:${10+d*18}px"><input type="radio" name="fd" value="${f.id}" style="width:auto" ${f.id===def?'checked':''}> ${ic('files')} ${esc(f.name)}</label>`+rows(f.id,d+1)).join('');
const m=modal(`<h2>${title}</h2><label class="card row" style="margin:4px 0"><input type="radio" name="fd" value="" style="width:auto" ${!def?'checked':''}> ${ic('home')} الجذر (بدون مجلد)</label>${rows(null,0)}<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn" id="ok">تأكيد</button><button class="btn alt" id="nf">${ic('plus')} مجلد جديد</button><button class="btn alt" onclick="close()">إلغاء</button></div>`);
const cur=()=>{const v=m.querySelector('input[name=fd]:checked');return v&&v.value?v.value:null};
m.querySelector('#ok').onclick=()=>{const v=cur();m.remove();cb(v)};
m.querySelector('#nf').onclick=()=>{const n=prompt('اسم المجلد الجديد (داخل المحدد)');if(!n)return;const nid=uid();S.items.push({id:nid,name:n,folder:1,parent:cur(),created:Date.now()});addLog('إنشاء مجلد',n);save();m.remove();chooseFolder(nid,title,cb,ex)}}
function moveItem(id){const i=S.items.find(x=>x.id===id);chooseFolder(i.parent||null,'نقل «'+esc(i.name)+'» إلى',d=>{i.parent=d;addLog('نقل',i.name);save();toast('تم النقل');render()},i.folder?i.id:null)}
function openF(id){cwd=id;go('files')}
function newFolder(){const n=prompt('اسم المجلد');if(!n)return;S.items.push({id:uid(),name:n,folder:1,parent:cwd,created:Date.now()});addLog('إنشاء مجلد',n);save();render()}
function pick(cam){const f=cam?$('#fc'):$('#fi');f.value='';f.onchange=()=>{const fl=[...f.files];if(!fl.length)return;chooseFolder(page==='files'?cwd:null,'حفظ في أي مجلد؟',dest=>{fl.forEach(file=>{if(file.size>30e6)return toast('الملف أكبر من 30MB: '+file.name);const r=new FileReader();r.onload=()=>{S.items.push({id:uid(),name:file.name,mime:file.type,data:r.result,parent:dest,created:Date.now()});addLog('إضافة',file.name);save();render()};r.readAsDataURL(file)})})};f.click()}
function srch(v){q=v;if(page!=='home'&&page!=='files')page='files';render();const e=$('#sq');if(e){e.focus();e.setSelectionRange(v.length,v.length)}}
function matches(){const s=q.trim().toLowerCase();return live().filter(i=>(i.name+' '+(i.tag||'')).toLowerCase().includes(s))}
function searchBox(){return `<input id="sq" type="search" placeholder="بحث في الملفات والمجلدات والوسوم" value="${esc(q)}" oninput="srch(this.value)">`}
const fmt=d=>new Date(d).toLocaleString('ar-SA');
const V={
home(){const L=live(),r=L.filter(i=>i.exp),soon=r.filter(i=>days(i.exp)<=30).length;
return searchBox()+(q?list(matches()):`<div class="row" style="flex-wrap:wrap;margin:8px 0"><button class="btn" onclick="pick(1)">${ic('cam')} إضافة صورة</button><button class="btn" onclick="pick(1)">${ic('scan')} مسح مستند</button><button class="btn alt" onclick="pick(0)">${ic('plus')} رفع ملف</button><button class="btn alt" onclick="go('fav')">${ic('fav')} المفضلة</button></div>
<div class="grid"><div class="card stat" onclick="go('files')"><b>${L.filter(i=>!i.folder).length}</b>المستندات</div><div class="card stat" onclick="go('renew')"><b>${r.length}</b>قابلة للتجديد${soon?` <span class="warn">(${soon} قريبة)</span>`:''}</div><div class="card stat" onclick="go('fav')"><b>${L.filter(i=>i.fav).length}</b>المفضلة</div><div class="card stat" onclick="go('trash')"><b>${S.items.filter(i=>i.trash).length}</b>السلة</div><div class="card stat" onclick="go('files')"><b>${L.filter(i=>i.folder).length}</b>المجلدات</div><div class="card stat" onclick="go('shares')"><b>${S.shares.length}</b>المشاركات</div></div><h2>أحدث العناصر</h2>`+list(L.slice().reverse().slice(0,5)))},
files(){const path=[];let c=cwd;while(c){const f=S.items.find(x=>x.id===c);if(!f)break;path.unshift(f);c=f.parent}
const cur=cwd&&S.items.find(x=>x.id===cwd);
return searchBox()+`<div class="row" style="flex-wrap:wrap;margin:8px 0"><button class="btn" onclick="newFolder()">${ic('plus')} مجلد</button><button class="btn" onclick="pick(0)">${ic('plus')} ملف</button><button class="btn alt" onclick="pick(1)">${ic('cam')} تصوير</button></div>`+
(q?'':`<div class="card"><a onclick="cwd=null;render()" style="cursor:pointer">الجذر</a>${path.map(p=>` / <a style="cursor:pointer" onclick="cwd='${p.id}';render()">${esc(p.name)}</a>`).join('')}${cur?` <button class="ib" onclick="cwd='${cur.parent||''}'||null;cwd=cwd||null;render()">${ic('back')}</button>`:''}</div>`)+list(q?matches():live().filter(i=>(i.parent||null)===cwd))},
renew(){return `<h2>التجديدات</h2><p><small>أضف تاريخ الانتهاء من زر التعديل على أي مستند (هوية، رخصة، استمارة...).</small></p>`+list(live().filter(i=>i.exp).sort((a,b)=>a.exp.localeCompare(b.exp)))},
fav(){return '<h2>المفضلة</h2>'+list(live().filter(i=>i.fav))},
quick(){return '<h2>الوصول السريع</h2>'+list(live().filter(i=>i.quick))},
trash(){const t=S.items.filter(i=>i.trash);return `<h2>سلة المحذوفات</h2>${t.length?`<button class="btn red" onclick="if(confirm('إفراغ السلة؟')){S.items=S.items.filter(i=>!i.trash);addLog('إفراغ السلة','');save();render()}">${ic('del')} إفراغ السلة</button>`:''}`+list(t,1)},
log(){return '<h2>سجل النشاط</h2>'+(S.log.length?S.log.map(l=>`<div class="card"><b>${esc(l.act)}</b> — ${esc(l.name)}<br><small>${fmt(l.at)}</small><div class="acts" style="margin-top:6px"><button class="ib" onclick="modal('<h2>${esc(l.act)}</h2><p>${esc(l.name)}<br><small>${fmt(l.at)}</small></p><button class=&quot;btn alt&quot; onclick=&quot;close()&quot;>إغلاق</button>')">${ic('eye')}</button><button class="ib" onclick="editLog('${l.id}')">${ic('edit')}</button><button class="ib d" onclick="S.log=S.log.filter(x=>x.id!=='${l.id}');save();render()">${ic('del')}</button></div></div>`).join(''):'<div class="card">لا يوجد نشاط</div>')},
shares(){return '<h2>المشاركات</h2><p><small>للمشاركة اضغط أيقونة واتساب على أي مستند.</small></p>'+(S.shares.length?S.shares.map(s=>`<div class="card"><b>${esc(s.name)}</b><br><small>${s.to?'إلى '+esc(s.to)+' · ':''}${fmt(s.at)}</small><div class="acts" style="margin-top:6px"><button class="ib" onclick="preview('${s.item}')">${ic('eye')}</button><button class="ib" onclick="editShare('${s.id}')">${ic('edit')}</button><button class="ib" onclick="shareItem('${s.item}')">${ic('wa')}</button><button class="ib d" onclick="S.shares=S.shares.filter(x=>x.id!=='${s.id}');save();render()">${ic('del')}</button></div></div>`).join(''):'<div class="card">لا توجد مشاركات</div>')},
storage(){const b=JSON.stringify(S).length,mb=(b/1048576).toFixed(2);return `<h2>التخزين</h2><div class="card"><p>المستخدم: ${mb} MB من ${EST.q?(EST.q/1073741824).toFixed(1)+' GB':'مساحة الجهاز'} (حسب المتاح في جهازك)</p><div class="bar"><i style="width:${EST.q?Math.max(1,Math.min(100,b/EST.q*100)):1}%"></i></div></div><h2>النسخ الاحتياطي</h2><div class="card"><label>البريد الإلكتروني للنسخ الاحتياطي</label><input id="em" type="email" dir="ltr" value="${esc(S.email)}" placeholder="name@example.com"><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="S.email=$('#em').value.trim();save();toast('تم حفظ البريد')">حفظ البريد</button><button class="btn" onclick="backup()">نسخ احتياطي الآن</button><button class="btn alt" onclick="restoreBk()">استعادة من ملف</button></div><small>تفتح قائمة المشاركة لاختيار البريد (Gmail) أو غيره وإرسال الملف إلى بريدك. إن لم تظهر القائمة يُنزَّل الملف مباشرة.</small></div>`},
status(){const b=JSON.stringify(S).length;return `<h2>حالة التطبيق</h2>`+[['التخزين المحلي',saveOK?'يعمل':'ممتلئ',saveOK],['الاتصال',navigator.onLine?'متصل':'غير متصل',navigator.onLine],['البريد الاحتياطي',S.email?'مضبوط':'غير مضبوط',!!S.email],['مستندات منتهية',live().filter(i=>i.exp&&days(i.exp)<0).length+' مستند',!live().some(i=>i.exp&&days(i.exp)<0)],['حجم البيانات',(b/1048576).toFixed(2)+' MB',b<(EST.q||5e6)*0.9]].map(r=>`<div class="card row"><b class="info">${r[0]}</b><span class="${r[2]?'ok':'bad'}">${r[1]}</span></div>`).join('')},
settings(){return `<h2>الإعدادات</h2><div class="card row"><span class="info">الوضع الليلي/النهاري</span><button class="btn" onclick="theme()">تبديل</button></div><div class="card row"><span class="info">تصدير نسخة احتياطية</span><button class="btn" onclick="backup()">تصدير</button></div><div class="card row"><span class="info">حذف جميع البيانات</span><button class="btn red" onclick="if(confirm('حذف كل البيانات نهائيًا؟')){S={items:[],log:[],shares:[],email:'',theme:S.theme};save();render()}">حذف</button></div>`},
dev(){return `<h2>المطور</h2><div class="card" style="text-align:center"><div class="thumb" style="margin:auto;width:70px;height:70px">${ic('dev')}</div><h2>عدنان صبياني</h2><p><a class="btn" href="tel:00966542103430">اتصال: 00966542103430</a></p><p><a class="btn" href="https://wa.me/009609600071" target="_blank" rel="noopener">${ic('wa')} واتساب: 0096509600071</a></p></div>`}
};
function editLog(id){const l=S.log.find(x=>x.id===id),n=prompt('تعديل الوصف',l.name);if(n!==null){l.name=n;save();render()}}
function editShare(id){const s=S.shares.find(x=>x.id===id),n=prompt('رقم المستلم',s.to||'');if(n!==null){s.to=n;save();render()}}
async function backup(){try{toast('جاري تجهيز النسخة...');await new Promise(r=>setTimeout(r,50));
const parts=['{"v":2,"email":'+JSON.stringify(S.email||'')+',"log":'+JSON.stringify(S.log)+',"shares":'+JSON.stringify(S.shares)+',"items":['];
S.items.forEach((it,k)=>parts.push((k?',':'')+JSON.stringify(it)));parts.push(']}');
const blob=new Blob(parts,{type:'application/json'}),name='docorg-backup-'+new Date().toISOString().slice(0,10)+'.json';
addLog('نسخ احتياطي',S.email||'ملف');save();
const f=new File([blob],name,{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'نسخة احتياطية - منظّم المستندات',text:S.email?'أرسلها إلى: '+S.email:'نسخة احتياطية'});return}catch(e){if(e.name==='AbortError')return}}
const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},60000);toast('تم تنزيل ملف النسخة');
}catch(e){toast('تعذر إنشاء النسخة، الملفات كبيرة جدًا')}}
function restoreBk(){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render();toast('تمت الاستعادة')}catch(e){toast('ملف غير صالح')}};r.readAsText(f.files[0])};f.click()}
function render(){nav();$('#ttl').textContent=(PAGES.find(p=>p[0]===page)||[])[1];$('#main').innerHTML=V[page]();if(q){const e=$('#sq');if(e)e.focus()}}
history.pushState({a:1},'');let lastBack=0;
addEventListener('popstate',()=>{if(Date.now()-lastBack<2000){history.back();return}lastBack=Date.now();history.pushState({a:1},'');toast('اضغط مرة أخرى للخروج')});
render();
(async()=>{try{db=await idb();const g=db.transaction('kv').objectStore('kv').get('S');const v=await new Promise(r=>{g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)});if(v){S=Object.assign(S,v);try{localStorage.removeItem('docorg')}catch(e){}}else if(S.items.length||S.log.length||S.email){save()}}catch(e){db=null}
try{if(navigator.storage){navigator.storage.persist&&navigator.storage.persist();const e=await navigator.storage.estimate();EST={u:e.usage,q:e.quota}}}catch(e){}
if(S.theme)document.documentElement.dataset.theme=S.theme;render()})();
</script>
</body>
